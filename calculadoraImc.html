<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />

    <!-- Meu CSS -->
    <link rel="stylesheet" href="/css/calculadoraImc.css" />
    <title>How Is My IMC?</title>
  </head>
  <body>
    <div class="container"></div>
    <!-- Cabeçalho do site -->
    <header>
      <!-- Área de navegação -->
      <nav class="navbar navbar-expand-sm navbar-light">
        <div class="container-fluid">
          <a href="#" class="navbar-brand">
            <img
              src="design/img/img-logo.jpg"
              alt=""
              height="80"
              class="rounded"
            />
          </a>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navBarMenu"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navBarMenu">
            <ul class="navbar-nav m-auto">
              <li class="nav-item m-2">
                <a href="index.html" class="nav-link">Página Inicial</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
      <!-- Área de navegação - FIM -->
    </header>
    <!-- Cabeçalho do site - FIM -->

    <article class="container-fluid">
      <h1 class="text-center">Tabela IMC</h1>
      <div class="row" id="imc-tabela">
        <div class="col-6 text-end">
          <h3>IMC</h3>
          <p>Menor do que 18.5</p>
          <p>Entre 18.5 e 24.9</p>
          <p>Entre 25 e 29.9</p>
          <p>Entre 30 e 34.9</p>
          <p>Entre 35 e 39.9</p>
          <p>Maior do que 40.0</p>
        </div>
        <div class="col-6 text-start">
          <h3>Resultados</h3>
          <p>Abaixo do peso</p>
          <p>Peso normal</p>
          <p>Sobrepeso</p>
          <p>Obesidade Grau I</p>
          <p>Obesidade Grau II</p>
          <p>Obesidade Grau III</p>
        </div>
      </div>
    </article>

    <!-- Conteudo principal - Form -->
    <main class="container-fluid m-5">
      <h1 class="text-center">Calcule seu IMC</h1>
      <form>
        <div class="row">
          <div class="col-6">
            <div>
              <label class="form-label fs-4">Peso: </label>
              <input
                type="text"
                class="form-control"
                id="pesoUsuario"
                placeholder="Ex.: 80.5"
              />
            </div>

            <div>
              <label class="form-label fs-4">Altura: </label>
              <input
                type="text"
                class="form-control"
                id="alturaUsuario"
                placeholder="Ex.: 1.85"
              />
            </div>

            <button type="submit" class="btn btn-success mt-4 w-100">
              Enviar
            </button>
          </div>
          <div class="col-6" id="result">
            <h3 class="text-center">Resultado</h3>
            <span id="resultCalc"></span>
          </div>
        </div>
      </form>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
